<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stow icon preview</title>
    <style>
      :root {
        color-scheme: dark;
        --canvas: #0c0c0c;
        --ink: #eeeeee;
        --muted: #8a8a8a;
        --line: #333033;
        --accent: #a5a0b6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 48px;
        background: var(--canvas);
        color: var(--ink);
        font: 14px/1.5 ui-monospace, monospace;
      }
      h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
      p { margin: 0 0 40px; color: var(--muted); }
      section { margin-bottom: 40px; }
      h2 { margin: 0 0 16px; color: var(--accent); font-size: 11px; font-weight: 400; letter-spacing: 0.14em; text-transform: uppercase; }
      .row { display: flex; align-items: end; gap: 24px; flex-wrap: wrap; }
      figure { margin: 0; display: grid; gap: 8px; justify-items: center; }
      figcaption { color: var(--muted); font-size: 10px; }
      .toolbar { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border: 1px solid var(--line); }
      .toolbar.light { background: #f1f3f4; color: #202124; border-color: #c9c9c9; }
      .toolbar.dark { background: #202124; color: #e8eaed; }
      .toolbar .url { flex: 1; height: 24px; padding: 4px 10px; border-radius: 12px; background: rgb(127 127 127 / 0.18); font-size: 11px; }
      .toolbar .ext { display: grid; place-items: center; width: 28px; height: 28px; }
      .toolbar .ext img { width: 16px; height: 16px; image-rendering: pixelated; }
      .mono { filter: grayscale(1); }
      .zoom { transform: scale(2); transform-origin: top left; }
      .zoom img { image-rendering: pixelated; }
      code { color: var(--accent); }
    </style>
  </head>
  <body>
    <h1>Stow icon preview</h1>
    <p><code>layered-archive</code> · raster master · check the 16 px tile at 100%.</p>

    <section>
      <h2>Size family</h2>
      <div class="row">
        <figure><img src="../../public/icon/16.png" width="16" height="16" alt="" /><figcaption>16</figcaption></figure>
        <figure><img src="../../public/icon/32.png" width="32" height="32" alt="" /><figcaption>32</figcaption></figure>
        <figure><img src="../../public/icon/48.png" width="48" height="48" alt="" /><figcaption>48</figcaption></figure>
        <figure><img src="../../public/icon/64.png" width="64" height="64" alt="" /><figcaption>64</figcaption></figure>
        <figure><img src="../../public/icon/128.png" width="128" height="128" alt="" /><figcaption>128</figcaption></figure>
      </div>
    </section>

    <section>
      <h2>Toolbar, both themes</h2>
      <div class="toolbar light">
        <span>◀ ▶ ⟳</span><span class="url">chrome://extensions</span><span class="ext"><img src="../../public/icon/16.png" width="16" height="16" alt="" /></span><span>⋮</span>
      </div>
      <div class="toolbar dark" style="margin-top: 8px">
        <span>◀ ▶ ⟳</span><span class="url">chrome://extensions</span><span class="ext"><img src="../../public/icon/16.png" width="16" height="16" alt="" /></span><span>⋮</span>
      </div>
    </section>

    <section>
      <h2>Grayscale and 2× inspection</h2>
      <div class="row">
        <figure class="mono"><img src="../../public/icon/32.png" width="32" height="32" alt="" /><figcaption>grayscale</figcaption></figure>
        <figure><div class="zoom"><img src="../../public/icon/16.png" width="16" height="16" alt="" /></div><figcaption>16 @ 2×</figcaption></figure>
        <figure><div class="zoom"><img src="../../public/icon/32.png" width="32" height="32" alt="" /></div><figcaption>32 @ 2×</figcaption></figure>
      </div>
    </section>
  </body>
</html>
