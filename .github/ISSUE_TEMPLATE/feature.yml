name: Feature request
description: Suggest a capability or a change in how Stow works.
title: "[feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Stow is deliberately small: local-first, no account, no sync, no host permissions. Proposals
        that preserve those constraints are much easier to accept.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not only the proposed UI.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Saving and closing tabs
        - Restoring tabs
        - Library and search
        - Trash and undo
        - Import and export
        - Settings and accessibility
        - Landing page or documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This can work without a server, account, sync, telemetry, or host permissions.
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true
